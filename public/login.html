<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bokmärkt – Logga in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Bungee+Hairline&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/users.css" />
  </head>
  <body class="auth-page">
    <div class="container">
      <header class="site-header">
        <a href="index.html" class="site-logo">
          <img
            src="images/bokmarkt-logo.png"
            alt="Bokmärkt – gå till startsidan"
            class="site-logo-image"
          />
        </a>

        <nav aria-label="Huvudnavigation">
          <ul class="nav-list">
            <li><a href="index.html">Hem</a></li>
            <li><a href="index.html#books-heading">Böcker</a></li>
            <li><a href="register.html">Skapa konto</a></li>
            <li>
              <a href="login.html" class="nav-login-link">Logga in</a>
            </li>
          </ul>
        </nav>
      </header>
    </div>

    <main class="auth-main">
      <form id="login-form" novalidate>
        <h2>Logga in</h2>

        <div class="form-group">
          <label for="username">Användarnamn:</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            aria-describedby="login-username-error"
            required
          />
          <p
            id="login-username-error"
            class="field-error"
            aria-live="polite"
          ></p>
        </div>

        <div class="form-group">
          <label for="password">Lösenord:</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            aria-describedby="login-password-error"
            required
          />
          <p
            id="login-password-error"
            class="field-error"
            aria-live="polite"
          ></p>
        </div>

        <button type="submit" id="login-btn">Logga in</button>

        <p id="login-message" role="status" aria-live="polite"></p>

        <p>Har du inget konto? <a href="register.html">Skapa konto</a></p>
      </form>
    </main>

    <script src="js/functions.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
