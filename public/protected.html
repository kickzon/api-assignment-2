<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/users.css" />
    <link rel="stylesheet" href="css/books.css" />
  </head>
  <body>
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mt-4">
        <h1>Users</h1>
        <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
      </div>
      <p id="users-message"></p>
      <div id="users-list"></div>
      <div id="books-list">
        <table class="books-table">
          <h2>Books</h2>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Genres</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody class="books-table-body"></tbody>
        </table>
        <button type="button" class="add-book-btn">Add new book</button>
      </div>
      <div class="modal hidden">
        <form class="create-book-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" />
          </div>

          <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" />
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>
          </div>

          <div class="form-group">
            <label for="genres">Genre</label>
            <input type="text" id="genres" name="genres" />
          </div>

          <div class="form-group">
            <label for="image">Image</label>
            <input type="text" id="image" name="image" />
          </div>

          <div class="form-group">
            <label for="published-year">Published</label>
            <input type="number" id="published-year" name="published_year" />
          </div>

          <button type="submit">Add book</button>
        </form>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/functions.js"></script>
    <script src="js/protected.js"></script>
    <script src="js/books.js"></script>
    <script src="js/form.js"></script>
  </body>
</html>
