<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bokmärkt – Mitt konto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Bungee+Hairline&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/users.css" />
    <link rel="stylesheet" href="css/books.css" />
    <link rel="stylesheet" href="css/admin-reviews.css" />
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <a href="index.html" class="site-logo">
          <img
            src="images/bokmarkt-logo.png"
            alt="Bokmärkt – gå till startsidan"
            class="site-logo-image"
          />
        </a>

        <nav aria-label="Huvudnavigation">
          <ul class="nav-list">
            <li><a href="index.html">Hem</a></li>
            <li><a href="index.html#books-heading">Böcker</a></li>
            <li>
              <a href="protected.html" id="account-nav-link">Mitt konto</a>
            </li>
            <li>
              <button id="logout-btn" type="button">Logga ut</button>
            </li>
          </ul>
        </nav>
      </header>

      <h1 id="page-title">Mitt konto</h1>
      <p id="users-message"></p>
      <div id="users-list"></div>
      <section id="admin-tools" class="hidden" aria-label="Adminverktyg">
        <div id="books-list">
          <h2 id="admin-books-heading">Böcker</h2>
          <table class="books-table">
            <thead>
              <tr>
                <th>Titel</th>
                <th>Författare</th>
                <th>Genrer</th>
                <th>Skapad</th>
              </tr>
            </thead>
            <tbody class="books-table-body"></tbody>
          </table>
          <button type="button" class="add-book-btn">Lägg till ny bok</button>
        </div>

        <div id="admin-reviews">
          <h2>Recensioner</h2>

          <p id="reviews-message" aria-live="polite"></p>

          <table class="reviews-table">
            <thead>
              <tr>
                <th>Bok</th>
                <th>Namn</th>
                <th>Betyg</th>
                <th>Recension</th>
                <th>Skapad</th>
                <th>Åtgärd</th>
              </tr>
            </thead>
            <tbody id="admin-reviews-list"></tbody>
          </table>
        </div>

        <div class="modal hidden">
          <form class="create-book-form">
            <div class="form-group">
              <label for="title">Titel</label>
              <input type="text" id="title" name="title" />
            </div>

            <div class="form-group">
              <label for="author">Författare</label>
              <input type="text" id="author" name="author" />
            </div>

            <div class="form-group">
              <label for="description">Beskrivning</label>
              <textarea id="description" name="description"></textarea>
            </div>

            <div class="form-group">
              <label for="genres">Genrer</label>
              <input type="text" id="genres" name="genres" />
            </div>

            <div class="form-group">
              <label for="image">Bildadress</label>
              <input type="text" id="image" name="image" />
            </div>

            <div class="form-group">
              <label for="published-year">Utgivningsår</label>
              <input type="number" id="published-year" name="published_year" />
            </div>

            <button type="submit">Lägg till bok</button>
          </form>
        </div>
      </section>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/functions.js"></script>
    <script src="js/admin-reviews.js"></script>
    <script src="js/protected.js"></script>
    <script src="js/books.js"></script>
    <script src="js/form.js"></script>
  </body>
</html>
