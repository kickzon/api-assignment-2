<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bokmärkt</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Bungee+Hairline&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/books.css" />
  </head>
  <body class="home-page">
    <div class="container">
      <header class="site-header">
        <a href="index.html" class="site-logo">
          <img
            src="images/bokmarkt-logo.png"
            alt="Bokmärkt – gå till startsidan"
            class="site-logo-image"
          />
        </a>

        <nav aria-label="Huvudnavigation">
          <ul class="nav-list">
            <li><a href="index.html">Hem</a></li>
            <li><a href="#books-heading">Böcker</a></li>
            <li><a href="register.html">Skapa konto</a></li>
            <li>
              <a href="login.html" class="nav-login-link">Logga in</a>
            </li>
          </ul>
        </nav>
      </header>

      <main>
        <section class="home-intro-text">
          <h1>Välkommen till Bokmärkt</h1>
          <p>Hitta nästa bok och dela vad du tyckte om den med andra.</p>
        </section>

        <section aria-labelledby="books-heading">
          <h2 id="books-heading">Upptäck nya böcker</h2>
          <p id="books-status" class="books-status" aria-live="polite">
            Laddar böcker...
          </p>
          <div class="books"></div>
        </section>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/functions.js"></script>
    <script src="js/books.js"></script>
  </body>
</html>
